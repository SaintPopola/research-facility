name: Build VST3/AU plugin

# Compile Research Facility into a VST3 + AU bundle on GitHub-hosted macOS
# runners. No local Xcode required for the user — the cloud does the heavy
# lifting. Output artifacts (.vst3 + .component) are downloaded back to the
# user's machine via `scripts/download_build.sh`.
#
# Triggers:
#   - push to main: runs automatically
#   - manual via GitHub UI: Actions → Build VST3/AU plugin → Run workflow
#   - via `gh workflow run build-plugin.yml` from local machine

on:
  workflow_dispatch:
  workflow_call:      # lets release.yml reuse this exact build + installer job
  push:
    branches: [main]
    paths:
      # Only rebuild when these change — saves CI minutes
      - 'hise_project/**'
      - 'packaging/**'
      - '.github/workflows/build-plugin.yml'

jobs:
  build_macos:
    name: macOS Universal
    runs-on: macos-14    # Apple Silicon runner; covers arm64 + x86_64 via universal

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p
          echo "Available SDKs:"
          xcodebuild -showsdks | head -20

      - name: Cache HISE source
        id: cache-hise
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/hise-source
          key: hise-source-4.1.0

      - name: Clone HISE source (4.1.0)
        if: steps.cache-hise.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 4.1.0 https://github.com/christophhart/HISE.git "$GITHUB_WORKSPACE/hise-source" || \
            git clone --depth 1 https://github.com/christophhart/HISE.git "$GITHUB_WORKSPACE/hise-source"
          cd "$GITHUB_WORKSPACE/hise-source"
          git submodule update --init --depth 1 JUCE
          # Make Projucer available at the path batchCompileOSX expects
          mkdir -p tools/Projucer
          if [ -d "JUCE/projucer/Projucer.app" ] && [ ! -d "tools/Projucer/Projucer.app" ]; then
            cp -R "JUCE/projucer/Projucer.app" "tools/Projucer/Projucer.app"
          fi

      - name: Install xcpretty (for batchCompileOSX)
        run: gem install --user-install xcpretty || sudo gem install xcpretty

      - name: Install VST3 SDK into HISE source tree
        run: |
          SDK_DST="$GITHUB_WORKSPACE/hise-source/tools/SDK/VST3 SDK"
          mkdir -p "$GITHUB_WORKSPACE/hise-source/tools/SDK"
          if [ ! -d "$SDK_DST" ]; then
            git clone --depth 1 --recursive https://github.com/steinbergmedia/vst3sdk.git "$SDK_DST"
          fi
          ls "$SDK_DST" | head -10

      - name: Download HISE 4.1.0 binary
        run: |
          mkdir -p "$GITHUB_WORKSPACE/hise-app"
          cd "$GITHUB_WORKSPACE/hise-app"
          curl -L --retry 3 \
            -o HISE.dmg \
            "https://github.com/christophhart/HISE/releases/download/4.1.0/HISE.4.1.0.dmg.macOS.Universal.Binary.dmg"
          yes Y | PAGER=cat hdiutil attach HISE.dmg -nobrowse
          cp -R "/Volumes/HISE Installer/HISE.app" .
          hdiutil detach "/Volumes/HISE Installer" -quiet
          xattr -dr com.apple.quarantine HISE.app

      - name: Configure HISE CLI + export plugin (single step for persistence)
        run: |
          set -e
          HISE_BIN="$GITHUB_WORKSPACE/hise-app/HISE.app/Contents/MacOS/HISE"
          PROJECT_DIR="$GITHUB_WORKSPACE/hise_project/ResearchFacility"
          HISE_SRC="$GITHUB_WORKSPACE/hise-source"
          PRESET="$PROJECT_DIR/XmlPresetBackups/ResearchFacility.xml"

          echo "=== Configure ==="
          "$HISE_BIN" set_hise_folder -p:"$HISE_SRC"
          "$HISE_BIN" set_project_folder -p:"$PROJECT_DIR"
          "$HISE_BIN" get_project_folder

          echo ""
          echo "=== Verify HISE source structure ==="
          ls "$HISE_SRC/" | head -20
          test -f "$HISE_SRC/projects/standalone/HISE Standalone.jucer" || \
            { echo "ERROR: HISE source missing projucer file"; exit 1; }

          echo ""
          echo "=== Re-verify Projucer location ==="
          ls -la "$HISE_SRC/tools/Projucer/" 2>&1 | head -5
          test -d "$HISE_SRC/tools/Projucer/Projucer.app" || \
            { echo "ERROR: Projucer.app not at expected path"; exit 1; }

          echo ""
          echo "=== Export (generates Xcode project + batchCompileOSX) ==="
          # Use plain `export` (not export_ci) because export_ci IGNORES the
          # global HISE path per docs and expects HISE.app to be inside the
          # source tree. Plain export honors set_hise_folder OR -h: inline.
          "$HISE_BIN" export "$PRESET" -h:"$HISE_SRC" -t:instrument -p:VST_AU -a:x86x64

          echo ""
          echo "=== Patch generated .jucer to disable Intel IPP ==="
          JUCER="$PROJECT_DIR/Binaries/AutogeneratedProject.jucer"
          test -f "$JUCER" || { echo "ERROR: $JUCER not generated"; exit 1; }
          python3 - "$JUCER" <<'PY'
          import re, sys
          path = sys.argv[1]
          with open(path) as f:
              txt = f.read()
          before = len(txt)
          # Strip IPP1ALibrary attribute that activates IPP-aware include paths
          txt = txt.replace(' IPP1ALibrary="Static_Library"', '')
          # Clear extraLinkerFlags that reference libipp* archives
          txt = re.sub(r'extraLinkerFlags="[^"]*libipp[^"]*"', 'extraLinkerFlags=""', txt)
          # Strip /opt/intel/ipp paths from headerPath / libraryPath attributes
          txt = re.sub(r'headerPath="[^"]*intel/ipp[^"]*"', 'headerPath=""', txt)
          txt = re.sub(r'libraryPath="[^"]*intel/ipp[^"]*"', 'libraryPath=""', txt)
          # KEY: flip USE_IPP="1" → USE_IPP="0" in <JUCEOPTIONS> block — that's
          # what causes Projucer to emit `#define USE_IPP 1` in AppConfig.h
          # which is what makes hi_tools.h include the missing ipp.h.
          txt = re.sub(r'USE_IPP="1"', 'USE_IPP="0"', txt)
          # Also disable VST2 backward-compat in JUCE's VST3 wrapper —
          # JUCE defaults JUCE_VST3_CAN_REPLACE_VST2=1 which requires vst2.x
          # headers that Steinberg removed from the public VST3 SDK.
          if 'JUCE_VST3_CAN_REPLACE_VST2' in txt:
              txt = re.sub(r'JUCE_VST3_CAN_REPLACE_VST2="[01]"', 'JUCE_VST3_CAN_REPLACE_VST2="0"', txt)
          else:
              # Inject the attribute into the <JUCEOPTIONS ...> opening tag
              txt = re.sub(r'(<JUCEOPTIONS\s)', r'\1JUCE_VST3_CAN_REPLACE_VST2="0" ', txt, count=1)
          # NOTE: deliberately NOT touching extraDefs — that uses &#10; XML
          # entities and naive editing corrupts the XML.
          with open(path, 'w') as f:
              f.write(txt)
          print("Patched IPP refs:", before, "->", len(txt), "bytes")
          PY

          echo ""
          echo "=== Run batchCompileOSX (Projucer resave + xcodebuild) ==="
          BINARIES_DIR="$PROJECT_DIR/Binaries"
          ls -la "$BINARIES_DIR" | head -10
          test -f "$BINARIES_DIR/batchCompileOSX" || \
            { echo "ERROR: batchCompileOSX not generated"; exit 1; }
          chmod +x "$BINARIES_DIR/batchCompileOSX"
          cd "$BINARIES_DIR"
          # Bypass xcpretty piping if it's not installed; raw xcodebuild output is fine in CI
          if ! command -v xcpretty >/dev/null 2>&1; then
            echo "xcpretty not on PATH — rewriting batchCompileOSX to skip it"
            sed -i.bak 's| | xcpretty||g; s| | xcpretty ||g' batchCompileOSX || true
          fi
          ./batchCompileOSX

          echo ""
          echo "=== Find built plugins ==="
          find "$BINARIES_DIR" -name "*.vst3" -o -name "*.component" 2>/dev/null | head -10

      - name: Locate built bundles
        run: |
          echo "Looking for build outputs..."
          find "$GITHUB_WORKSPACE/hise_project/ResearchFacility/Binaries" -name "*.vst3" -o -name "*.component" 2>/dev/null | head -20
          ls -la "$GITHUB_WORKSPACE/hise_project/ResearchFacility/Binaries/" 2>/dev/null || true

      - name: Upload VST3 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ResearchFacility-macOS-VST3
          path: |
            hise_project/ResearchFacility/Binaries/**/*.vst3
          if-no-files-found: warn

      - name: Upload AU artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ResearchFacility-macOS-AU
          path: |
            hise_project/ResearchFacility/Binaries/**/*.component
          if-no-files-found: warn

      - name: Build unsigned installer .pkg
        if: success()
        run: |
          set -e
          export RF_VST3="$(find hise_project/ResearchFacility/Binaries -name 'ResearchFacility.vst3' -type d | head -1)"
          export RF_AU="$(find hise_project/ResearchFacility/Binaries -name 'ResearchFacility.component' -type d | head -1)"
          echo "vst3=$RF_VST3"
          echo "au=$RF_AU"
          # samples come from the checked-out project Samples/ (RF_SAMPLES default);
          # no Developer ID on the runner -> produces a working UNSIGNED pkg.
          bash packaging/build_installer.sh
          ls -lah dist/*.pkg

      - name: Upload installer (unsigned)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ResearchFacility-macOS-Installer-unsigned
          path: dist/*.pkg
          if-no-files-found: warn

      - name: Upload full Binaries folder for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ResearchFacility-macOS-Binaries-debug
          path: hise_project/ResearchFacility/Binaries/
          if-no-files-found: warn
          retention-days: 7

  build_windows:
    name: Windows x64 VST3
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cache HISE source
        id: cache-hise-src
        uses: actions/cache@v4
        with:
          path: hise-source
          key: hise-source-win-4.1.0

      - name: Clone HISE source (4.1.0)
        if: steps.cache-hise-src.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch 4.1.0 https://github.com/christophhart/HISE.git "$GITHUB_WORKSPACE/hise-source"

      - name: Extract bundled SDKs (ASIO + VST3 ship in-repo as sdk.zip)
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/hise-source/tools/SDK"
          if [ ! -d "VST3 SDK" ]; then tar -xf sdk.zip; fi
          ls "VST3 SDK" | head -5
          ls ASIOSDK2.3 | head -5

      - name: Cache built HISE.exe
        id: cache-hise-exe
        uses: actions/cache@v4
        with:
          path: hise-source\projects\standalone\Builds\VisualStudio2022\x64\CI\App\HISE.exe
          key: hise-exe-win-4.1.0-ci-v1

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build HISE Standalone from source (CI config, ~40 min, cached after)
        if: steps.cache-hise-exe.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: hise-source
        run: |
          tools\projucer\Projucer.exe --resave "projects\standalone\HISE Standalone.jucer"
          msbuild "projects\standalone\Builds\VisualStudio2022\HISE Standalone.sln" /t:Build /p:Configuration=CI /p:Platform=x64 /v:m

      - name: Export plugin (VST3)
        shell: cmd
        run: |
          set HISE_EXE=%GITHUB_WORKSPACE%\hise-source\projects\standalone\Builds\VisualStudio2022\x64\CI\App\HISE.exe
          "%HISE_EXE%" set_hise_folder -p:"%GITHUB_WORKSPACE%\hise-source"
          "%HISE_EXE%" set_project_folder -p:"%GITHUB_WORKSPACE%\hise_project\ResearchFacility"
          "%HISE_EXE%" export "%GITHUB_WORKSPACE%\hise_project\ResearchFacility\XmlPresetBackups\ResearchFacility.xml" -h:"%GITHUB_WORKSPACE%\hise-source" -t:instrument -p:VST3 -a:x64

      - name: Patch generated .jucer (IPP off, VS2022 toolset)
        shell: bash
        run: |
          JUCER="$GITHUB_WORKSPACE/hise_project/ResearchFacility/Binaries/AutogeneratedProject.jucer"
          test -f "$JUCER" || { echo "ERROR: $JUCER not generated"; exit 1; }
          python scripts/ci/patch_jucer.py "$JUCER"

      - name: Build plugin (Projucer resave + MSBuild)
        shell: bash
        run: |
          BIN="$GITHUB_WORKSPACE/hise_project/ResearchFacility/Binaries"
          "$GITHUB_WORKSPACE/hise-source/tools/projucer/Projucer.exe" --resave "$BIN/AutogeneratedProject.jucer"
          SLN=$(find "$BIN/Builds" -name "*.sln" | head -1)
          test -n "$SLN" || { echo "ERROR: no .sln generated"; ls -R "$BIN/Builds" | head -40; exit 1; }
          echo "Building: $SLN"
          msbuild.exe "$SLN" -t:Build -p:Configuration=Release -p:Platform=x64 -v:m

      - name: Locate built plugin
        shell: bash
        run: |
          find "$GITHUB_WORKSPACE/hise_project/ResearchFacility/Binaries" -name "*.vst3" | head -10

      - name: Upload Windows VST3 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ResearchFacility-Windows-VST3
          path: hise_project/ResearchFacility/Binaries/**/*.vst3
          if-no-files-found: warn

      - name: Upload Windows Binaries folder for debugging
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ResearchFacility-Windows-Binaries-debug
          path: hise_project/ResearchFacility/Binaries/
          if-no-files-found: warn
          retention-days: 7
